<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة أذكار المسلم</title><link rel="stylesheet" href="css/app.css"><body><main class="app"><header class="top"><div class="brand"><img src="icon.png"><div><h1>إدارة المحتوى</h1><p>إضافة وتعديل واستيراد وتصدير المحتوى محليًا</p></div></div></header><section class="content"><div class="card"><input class="input" id="q" placeholder="بحث…"><br><br><button id="export">تصدير JSON</button> <label><button onclick="document.getElementById('imp').click()">استيراد JSON</button><input id="imp" type="file" accept="application/json" hidden></label><p class="muted">التعديلات هنا محلية على الجهاز ولا تنشر تلقائيًا إلى GitHub.</p></div><div id="out" class="list"></div></section></main><script type="module">import {loadData,norm} from './js/data.js';let D;const out=document.querySelector('#out');function render(){let q=norm(document.querySelector('#q').value);out.innerHTML=D.categories.map((c,ci)=>{let a=c.items.filter(x=>!q||norm(x.text).includes(q)||norm(x.title).includes(q));return a.length?`<div class="card"><b>${c.name}</b><div class="muted">${a.length} نتائج</div>${a.slice(0,20).map(x=>`<div class="card item"><b>${x.title||'ذكر'}</b><p>${x.text}</p></div>`).join('')}</div>`:''}).join('')||'<div class="card">لا توجد نتائج</div>'}loadData().then(x=>{D=x;render()});document.querySelector('#q').oninput=render;document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='azkar.json';a.click()};document.querySelector('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;D=JSON.parse(await f.text());render()};</script></body></html>
